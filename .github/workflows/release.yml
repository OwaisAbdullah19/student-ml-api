name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set lowercase repository owner
        id: repo_owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Get short commit SHA
        id: short_sha
        run: echo "SHA=$(echo ${GITHUB_SHA} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            --build-arg APP_VERSION=${{ steps.get_version.outputs.VERSION }} \
            --build-arg GIT_COMMIT=${{ github.sha }} \
            --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
            -t ghcr.io/${{ steps.repo_owner.outputs.OWNER }}/student-ml-api:${{ steps.get_version.outputs.VERSION }} .
          docker tag ghcr.io/${{ steps.repo_owner.outputs.OWNER }}/student-ml-api:${{ steps.get_version.outputs.VERSION }} ghcr.io/${{ steps.repo_owner.outputs.OWNER }}/student-ml-api:latest
          docker tag ghcr.io/${{ steps.repo_owner.outputs.OWNER }}/student-ml-api:${{ steps.get_version.outputs.VERSION }} ghcr.io/${{ steps.repo_owner.outputs.OWNER }}/student-ml-api:${{ steps.short_sha.outputs.SHA }}

      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ steps.repo_owner.outputs.OWNER }}/student-ml-api:${{ steps.get_version.outputs.VERSION }}
          docker push ghcr.io/${{ steps.repo_owner.outputs.OWNER }}/student-ml-api:latest
          docker push ghcr.io/${{ steps.repo_owner.outputs.OWNER }}/student-ml-api:${{ steps.short_sha.outputs.SHA }}